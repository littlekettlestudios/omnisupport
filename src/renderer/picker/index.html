<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Omni picker</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: rgba(0, 0, 0, 0.22); cursor: crosshair; user-select: none; }
      #sel { position: fixed; border: 1.5px solid #fff; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.22); background: transparent; display: none; pointer-events: none; }
      #hint { position: fixed; top: 48px; left: 50%; transform: translateX(-50%); color: #fff; font: 500 14px system-ui; background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 999px; pointer-events: none; }
      #size { position: fixed; color: #fff; font: 12px ui-monospace, monospace; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; display: none; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="hint">Drag over the thing you want me to look at · Esc to cancel</div>
    <div id="sel"></div>
    <div id="size"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
